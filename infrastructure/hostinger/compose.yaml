# OddVex on the shared Hostinger VPS: private preview.
#
# Nothing here publishes a port. Like the other projects on this server, the web and API
# containers join the shared reverse proxy's network (`medivh-automation_default`) under unique
# names; that proxy (Caddy) adds HTTPS, and a password on the web hostname. The database is
# reachable only inside this project.
#
# Started by infrastructure/hostinger/ops.sh (ACTION=deploy), which runs:
#   docker compose -p oddvex --env-file /opt/oddvex/.env -f infrastructure/hostinger/compose.yaml up -d
name: oddvex

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oddvex
      POSTGRES_PASSWORD: ${ODDVEX_DB_PASSWORD:?set ODDVEX_DB_PASSWORD}
      POSTGRES_DB: oddvex
    volumes: ["pgdata:/var/lib/postgresql/data"]
    networks:
      default: { aliases: [oddvex-db] }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oddvex"]
      interval: 10s
      retries: 10
    mem_limit: 512m

  api:
    build: ../../services/api
    image: oddvex-api:${ODDVEX_RELEASE:-local}
    restart: unless-stopped
    environment:
      ODDVEX_ENV: production
      DATABASE_URL: postgresql+psycopg://oddvex:${ODDVEX_DB_PASSWORD}@oddvex-db:5432/oddvex
      ODDVEX_JWT_SECRET: ${ODDVEX_JWT_SECRET:?set ODDVEX_JWT_SECRET}
      ODDVEX_CORS_ORIGINS: ${ODDVEX_PUBLIC_URL:?set ODDVEX_PUBLIC_URL}
      ODDVEX_WEB_BASE_URL: ${ODDVEX_PUBLIC_URL}
      ODDVEX_ADMIN_EMAILS: ${ODDVEX_ADMIN_EMAILS:-}
      # Direct traffic (the mobile app) arrives through the shared reverse proxy, so its
      # forwarded client address is trusted for rate limiting.
      ODDVEX_TRUST_PROXY: "true"
    depends_on:
      db: { condition: service_healthy }
    networks:
      default: {}
      edge: { aliases: [oddvex-api] }
    mem_limit: 768m

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${ODDVEX_PUBLIC_URL}
        NEXT_PUBLIC_CONTACT_EMAIL: ${ODDVEX_CONTACT_EMAIL:-}
    image: oddvex-web:${ODDVEX_RELEASE:-local}
    restart: unless-stopped
    environment:
      ODDVEX_API_URL: http://oddvex-api:8000
    depends_on:
      api: { condition: service_healthy }
    networks:
      default: {}
      edge: { aliases: [oddvex-web] }
    mem_limit: 512m

networks:
  edge:
    external: true
    name: ${ODDVEX_EDGE_NETWORK:-medivh-automation_default}

volumes:
  pgdata:
