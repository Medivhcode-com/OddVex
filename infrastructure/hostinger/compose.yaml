# OddVex on the shared Hostinger VPS: private preview.
#
# Nothing here publishes a port. Like the other projects on this server, the web and API
# containers join the shared reverse proxy's network (`medivh-automation_default`) under unique
# names; that proxy (Caddy) adds HTTPS, and a password on the web hostname. The database is
# reachable only inside this project.
#
# Started by infrastructure/hostinger/ops.sh (ACTION=deploy), which runs:
#   docker compose -p oddvex --env-file /opt/oddvex/.env -f infrastructure/hostinger/compose.yaml up -d
name: oddvex

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oddvex
      POSTGRES_PASSWORD: ${ODDVEX_DB_PASSWORD:?set ODDVEX_DB_PASSWORD}
      POSTGRES_DB: oddvex
    volumes: ["pgdata:/var/lib/postgresql/data"]
    networks:
      default: { aliases: [oddvex-db] }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oddvex"]
      interval: 10s
      retries: 10
    mem_limit: 512m

  api:
    build: ../../services/api
    image: oddvex-api:${ODDVEX_RELEASE:-local}
    restart: unless-stopped
    environment: &api-env
      ODDVEX_ENV: production
      DATABASE_URL: postgresql+psycopg://oddvex:${ODDVEX_DB_PASSWORD}@oddvex-db:5432/oddvex
      ODDVEX_JWT_SECRET: ${ODDVEX_JWT_SECRET:?set ODDVEX_JWT_SECRET}
      ODDVEX_CORS_ORIGINS: ${ODDVEX_PUBLIC_URL:?set ODDVEX_PUBLIC_URL}
      ODDVEX_WEB_BASE_URL: ${ODDVEX_PUBLIC_URL}
      ODDVEX_ADMIN_EMAILS: ${ODDVEX_ADMIN_EMAILS:-}
      # Direct traffic (the mobile app) arrives through the shared reverse proxy, so its
      # forwarded client address is trusted for rate limiting.
      ODDVEX_TRUST_PROXY: "true"
    depends_on:
      db: { condition: service_healthy }
    networks:
      default: {}
      edge: { aliases: [oddvex-api] }
    mem_limit: 768m

  # Evaluates alert rules and grades community picks every two minutes, so an alert fires even
  # when nobody has the app open. Delivery is still in-app only. A failed pass is logged and the
  # loop carries on.
  worker:
    image: oddvex-api:${ODDVEX_RELEASE:-local}
    restart: unless-stopped
    environment: *api-env
    command:
      - sh
      - -c
      - |
        while true; do
          python scripts/evaluate_alerts.py || echo "evaluate_alerts failed"
          python scripts/grade_picks.py || echo "grade_picks failed"
          sleep 120
        done
    healthcheck: { disable: true }
    depends_on:
      api: { condition: service_healthy }
    mem_limit: 256m

  # One compressed dump of the database every day, kept for 14 days in /opt/oddvex/backups on
  # the server. The dumps stay on the same disk: they protect against a bad change, not against
  # losing the server.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${ODDVEX_DB_PASSWORD}
    volumes: ["/opt/oddvex/backups:/backups"]
    command:
      - sh
      - -c
      - |
        umask 077
        while true; do
          f=/backups/oddvex-$$(date -u +%Y%m%dT%H%M%SZ).dump
          if pg_dump -h oddvex-db -U oddvex -Fc -f "$$f.part" oddvex; then mv "$$f.part" "$$f"; echo "wrote $$f"; else rm -f "$$f.part"; echo "backup failed"; fi
          find /backups -name 'oddvex-*.dump' -mtime +14 -delete
          sleep 86400
        done
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 128m

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${ODDVEX_PUBLIC_URL}
        NEXT_PUBLIC_CONTACT_EMAIL: ${ODDVEX_CONTACT_EMAIL:-}
    image: oddvex-web:${ODDVEX_RELEASE:-local}
    restart: unless-stopped
    environment:
      ODDVEX_API_URL: http://oddvex-api:8000
    depends_on:
      api: { condition: service_healthy }
    networks:
      default: {}
      edge: { aliases: [oddvex-web] }
    mem_limit: 512m

networks:
  edge:
    external: true
    name: ${ODDVEX_EDGE_NETWORK:-medivh-automation_default}

volumes:
  pgdata:
