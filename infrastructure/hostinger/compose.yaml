# OddVex on the shared Hostinger VPS: private preview.
#
# Nothing here publishes a public port. The web container listens on 127.0.0.1:${ODDVEX_WEB_PORT}
# only; the server's existing reverse proxy (Caddy) forwards preview.oddvex.com to it, adds HTTPS
# and asks for a password. The API and the database are reachable only inside this project.
#
# Run from the repository root on the server:
#   docker compose -p oddvex --env-file /opt/oddvex/.env -f infrastructure/hostinger/compose.yaml up -d --build
name: oddvex

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oddvex
      POSTGRES_PASSWORD: ${ODDVEX_DB_PASSWORD:?set ODDVEX_DB_PASSWORD}
      POSTGRES_DB: oddvex
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oddvex"]
      interval: 10s
      retries: 10
    mem_limit: 512m

  api:
    build: ../../services/api
    restart: unless-stopped
    environment:
      ODDVEX_ENV: production
      DATABASE_URL: postgresql+psycopg://oddvex:${ODDVEX_DB_PASSWORD}@db:5432/oddvex
      ODDVEX_JWT_SECRET: ${ODDVEX_JWT_SECRET:?set ODDVEX_JWT_SECRET}
      ODDVEX_CORS_ORIGINS: ${ODDVEX_PUBLIC_URL:?set ODDVEX_PUBLIC_URL}
      ODDVEX_WEB_BASE_URL: ${ODDVEX_PUBLIC_URL}
      ODDVEX_ADMIN_EMAILS: ${ODDVEX_ADMIN_EMAILS:-}
      # Only the web container talks to the API, so every request has the same address.
      # Per-account limits still apply; the per-address limit is left off behind the web app.
      ODDVEX_TRUST_PROXY: "false"
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 768m

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${ODDVEX_PUBLIC_URL}
        NEXT_PUBLIC_CONTACT_EMAIL: ${ODDVEX_CONTACT_EMAIL:-}
    restart: unless-stopped
    environment:
      ODDVEX_API_URL: http://api:8000
    depends_on:
      api: { condition: service_healthy }
    ports: ["127.0.0.1:${ODDVEX_WEB_PORT:-3410}:3000"]
    mem_limit: 512m

volumes:
  pgdata:
