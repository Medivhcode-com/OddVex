name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: OpenAPI schema is committed and current
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- openapi.json

  api-postgres:
    name: API on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: oddvex
          POSTGRES_PASSWORD: oddvex
          POSTGRES_DB: oddvex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oddvex" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Run the suite against PostgreSQL
        env:
          # Throwaway credentials for the job's own service container.
          ODDVEX_TEST_DATABASE_URL: postgresql+psycopg://oddvex:oddvex@localhost:5432/oddvex_test
        run: pytest -q

  web:
    name: Web (lint, types, unit, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated API types are current
        run: |
          pnpm types:generate
          git diff --exit-code -- packages/types
      - run: pnpm --filter @oddvex/web lint
      - run: pnpm --filter @oddvex/web typecheck
      - run: pnpm --filter @oddvex/web test
      - run: pnpm --filter @oddvex/web build

  mobile:
    name: Mobile (lint, types, unit, bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @oddvex/mobile lint
      - run: pnpm --filter @oddvex/mobile typecheck
      - run: pnpm --filter @oddvex/mobile test
      - name: Bundle for iOS and Android
        run: pnpm --filter @oddvex/mobile export:check

  e2e:
    name: End to end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: pip install -e "services/api[dev]"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @oddvex/web exec playwright install --with-deps chromium
      - run: pnpm --filter @oddvex/web build
      - run: pnpm --filter @oddvex/web test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7

  docker:
    name: Docker images (build, smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t oddvex-api services/api
      - name: Build web image
        run: docker build -t oddvex-web -f apps/web/Dockerfile .
      - name: Start both and check they answer
        run: |
          docker network create oddvex
          docker run -d --name api --network oddvex -p 8000:8000 oddvex-api
          docker run -d --name web --network oddvex -p 3000:3000 -e ODDVEX_API_URL=http://api:8000 oddvex-web
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health >/dev/null && curl -fsS http://localhost:3000/ >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/v1/meta
          curl -fsS -o /dev/null -w "home %{http_code}\n" http://localhost:3000/
          curl -fsS -o /dev/null -w "app %{http_code}\n" http://localhost:3000/app
      - name: Container logs
        if: failure()
        run: docker logs api; docker logs web

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript dependencies (fails on high or critical)
        run: pnpm audit --prod --audit-level high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python dependencies (fails on any known vulnerability)
        run: |
          python -m venv /tmp/api-venv
          /tmp/api-venv/bin/pip install ./services/api
          pip install pip-audit
          pip-audit --path "$(/tmp/api-venv/bin/python -c 'import site; print(site.getsitepackages()[0])')"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
