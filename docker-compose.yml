# Local development stack. Not a production configuration.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: oddvex
      POSTGRES_PASSWORD: oddvex-local-only
      POSTGRES_DB: oddvex
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oddvex"]
      interval: 5s
      retries: 10

  api:
    build: ./services/api
    environment:
      ODDVEX_ENV: development
      DATABASE_URL: postgresql+psycopg://oddvex:oddvex-local-only@db:5432/oddvex
      ODDVEX_CORS_ORIGINS: http://localhost:3000
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      ODDVEX_API_URL: http://api:8000
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  pgdata:
